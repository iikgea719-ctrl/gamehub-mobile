
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | GH PLAY STATION</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
.login{
  width:100%;
  max-width:390px;
  padding:30px 24px;
  border:1px solid #333;
  border-radius:14px;
  background:#090909;
}
.logo{
  text-align:center;
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
  margin-bottom:8px;
}
.subtitle{
  text-align:center;
  color:#999;
  font-size:13px;
  margin-bottom:30px;
}
h2{font-size:20px;margin-bottom:22px}
label{
  display:block;
  font-size:13px;
  color:#bbb;
  margin-bottom:8px;
}
input{
  width:100%;
  padding:14px;
  background:#111;
  border:1px solid #444;
  border-radius:7px;
  color:#fff;
  margin-bottom:18px;
  outline:none;
}
input:focus{border-color:#299dff}
button{
  width:100%;
  padding:14px;
  background:#168cff;
  color:#fff;
  border:0;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}
button:disabled{opacity:.5}
#message{
  margin-top:16px;
  font-size:13px;
  line-height:1.5;
  color:#ff7777;
  text-align:center;
}
.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#999;
  font-size:13px;
  text-decoration:none;
}
</style>
</head>
<body>

<div class="login">
  <div class="logo">GH PLAY STATION</div>
  <div class="subtitle">ADMIN CONTROL PANEL</div>

  <h2>Login Administrator</h2>

  <form id="loginForm">
    <label>Email Administrator</label>
    <input
      type="email"
      id="email"
      placeholder="Masukkan email admin"
      autocomplete="username"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginButton">
      MASUK KE DASHBOARD
    </button>
  </form>

  <div id="message" role="status"></div>
  <a href="index.html" class="back">← Kembali ke website</a>
</div>

<script>
const SUPABASE_URL = "https://xxkaiiyspdmsrhjqqige.supabase.co";
const SUPABASE_KEY = "sb_publishable_45T1esuLNy7wvREWW_1QTw_gmTntbpK";
  
const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginButton");

form.addEventListener("submit", async function(event){
  event.preventDefault();

  message.textContent = "";
  button.disabled = true;
  button.textContent = "MEMERIKSA LOGIN...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error) throw error;

    const { data: admin, error: adminError } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();

    if(adminError) throw adminError;

    if(!admin){
      await db.auth.signOut();
      throw new Error("Akun ini belum memiliki akses administrator.");
    }

    window.location.href = "admin.html";

  } catch(error) {
    message.textContent = error.message || "Login gagal.";
    button.disabled = false;
    button.textContent = "MASUK KE DASHBOARD";
  }
});
</script>

</body>
</html>
